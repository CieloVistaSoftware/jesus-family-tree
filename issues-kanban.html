<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Issues Kanban</title>
  <style>
    :root {
      --bg: #0d1117;
      --ink: #e6edf3;
      --muted: #93a1b2;
      --card: #161b22;
      --border: #30363d;
      --todo: #1f6feb;
      --doing: #d29922;
      --done: #238636;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(31, 111, 235, 0.2), transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(210, 153, 34, 0.2), transparent 40%),
        radial-gradient(circle at 60% 90%, rgba(35, 134, 54, 0.18), transparent 45%),
        var(--bg);
      min-height: 100vh;
    }

    .page {
      max-width: 1300px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 2vw + 1rem, 2.4rem);
      letter-spacing: 0.02em;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      background: rgba(22, 27, 34, 0.88);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      backdrop-filter: blur(3px);
    }

    .controls label {
      font-size: 0.86rem;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    input, select, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
    }

    input, select {
      background: #0d1117;
      color: var(--ink);
    }

    input::placeholder {
      color: #6e7681;
    }

    .controls button {
      cursor: pointer;
      background: #1f6feb;
      color: #fff;
      font-weight: 600;
      transition: transform 120ms ease, opacity 120ms ease;
      align-self: end;
      margin-top: 21px;
    }

    .controls button:hover { transform: translateY(-1px); }
    .controls button:active { transform: translateY(0); opacity: 0.94; }

    .status {
      margin: 8px 0 16px;
      color: var(--muted);
      min-height: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 12px;
    }

    .column {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(22, 27, 34, 0.9);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-height: 180px;
    }

    .column h2 {
      margin: 0;
      padding: 12px;
      font-size: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .todo h2 { background: #123057; }
    .doing h2 { background: #4a360c; }
    .done h2 { background: #133a1e; }

    .count {
      font-size: 0.82rem;
      color: var(--ink);
      background: rgba(13, 17, 23, 0.85);
      border-radius: 20px;
      padding: 2px 8px;
      border: 1px solid var(--border);
    }

    .list {
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      cursor: grab;
    }

    .card.dragging {
      opacity: 0.45;
      transform: rotate(1deg);
      cursor: grabbing;
    }

    .list.drop-target {
      outline: 2px dashed #58a6ff;
      outline-offset: -2px;
      border-radius: 8px;
      background: rgba(31, 111, 235, 0.12);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .card-btn {
      width: auto;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0d1117;
      color: var(--ink);
      cursor: pointer;
      font-size: 0.78rem;
    }

    .card-btn:hover {
      border-color: #58a6ff;
    }

    .card a {
      color: #79c0ff;
      text-decoration: none;
      font-weight: 600;
    }

    .card a:hover { text-decoration: underline; }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      background: #0d1117;
    }

    .editor {
      margin-top: 8px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
      display: grid;
      gap: 8px;
    }

    .editor textarea {
      width: 100%;
      min-height: 90px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
      color: var(--ink);
      padding: 8px;
      font: inherit;
    }

    .editor-row {
      display: flex;
      gap: 8px;
    }

    @media (max-width: 960px) {
      .controls { grid-template-columns: 1fr 1fr; }
      .board { grid-template-columns: 1fr; }
      button { margin-top: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>GitHub Issues Kanban</h1>
    <p class="sub">Load all issues for a repository and view them in a simple board.</p>

    <section class="controls" aria-label="Repository controls">
      <div>
        <label for="owner">Owner</label>
        <input id="owner" value="CieloVistaSoftware">
      </div>
      <div>
        <label for="repo">Repository</label>
        <select id="repo"></select>
      </div>
      <div>
        <label for="token">GitHub Token (optional)</label>
        <input id="token" type="password" placeholder="For higher API limits">
      </div>
      <div>
        <button id="loadBtn" type="button">Load Issues</button>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <section class="board" aria-label="Issue board">
      <article class="column todo">
        <h2>To Do <span id="todoCount" class="count">0</span></h2>
        <div id="todoList" class="list"></div>
      </article>
      <article class="column doing">
        <h2>In Progress <span id="doingCount" class="count">0</span></h2>
        <div id="doingList" class="list"></div>
      </article>
      <article class="column done">
        <h2>Done <span id="doneCount" class="count">0</span></h2>
        <div id="doneList" class="list"></div>
      </article>
    </section>
  </main>

  <script>
    const statusEl = document.getElementById("status");
    const loadBtn = document.getElementById("loadBtn");
    const ownerInput = document.getElementById("owner");
    const repoSelect = document.getElementById("repo");
    const tokenInput = document.getElementById("token");
    const issueStore = new Map();
    const listByColumn = {
      todo: document.getElementById("todoList"),
      doing: document.getElementById("doingList"),
      done: document.getElementById("doneList")
    };

    let activeContext = {
      owner: "",
      repo: "",
      token: ""
    };

    const statusKeywords = {
      todo: ["todo", "to do", "backlog", "planned", "next"],
      doing: ["in progress", "doing", "wip", "active", "working"],
      done: ["done", "complete", "completed", "closed", "resolved"]
    };

    const statusLabelByColumn = {
      todo: "todo",
      doing: "in progress",
      done: "done"
    };

    function hasLabel(labels, keywords) {
      const lowered = labels.map((l) => l.name.toLowerCase());
      return keywords.some((keyword) => lowered.some((name) => name.includes(keyword)));
    }

    function classifyIssue(issue) {
      if (issue.state === "closed" || hasLabel(issue.labels, statusKeywords.done)) {
        return "done";
      }
      if (hasLabel(issue.labels, statusKeywords.doing)) {
        return "doing";
      }
      return "todo";
    }

    function getIssueColumn(issue) {
      return issue._columnOverride || classifyIssue(issue);
    }

    function getLabelNames(issue) {
      return issue.labels.map((label) => label.name);
    }

    function isStatusLabel(labelName) {
      const lowered = labelName.toLowerCase();
      return Object.values(statusKeywords)
        .flat()
        .some((keyword) => lowered.includes(keyword));
    }

    function normalizeLabelsForColumn(issue, targetColumn) {
      const labels = getLabelNames(issue).filter((name) => !isStatusLabel(name));
      labels.push(statusLabelByColumn[targetColumn]);
      return [...new Set(labels)];
    }

    async function patchIssue(issueNumber, payload) {
      const { owner, repo, token } = activeContext;
      const headers = {
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json"
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const response = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/issues/${issueNumber}`,
        {
          method: "PATCH",
          headers,
          body: JSON.stringify(payload)
        }
      );

      if (!response.ok) {
        const body = await response.text();
        throw new Error(`Issue update failed (${response.status}): ${body}`);
      }

      return response.json();
    }

    function renderIssueCard(issue) {
      const card = document.createElement("div");
      card.className = "card";
      card.draggable = true;
      card.dataset.issueNumber = String(issue.number);

      card.addEventListener("dragstart", (event) => {
        card.classList.add("dragging");
        event.dataTransfer.setData("text/plain", String(issue.number));
      });

      card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
      });

      const head = document.createElement("div");
      head.className = "card-head";

      const title = document.createElement("a");
      title.href = issue.html_url;
      title.target = "_blank";
      title.rel = "noopener noreferrer";
      title.textContent = `#${issue.number} ${issue.title}`;

      const actions = document.createElement("div");
      actions.className = "card-actions";

      const editBtn = document.createElement("button");
      editBtn.type = "button";
      editBtn.className = "card-btn";
      editBtn.textContent = "Edit";
      editBtn.addEventListener("click", () => openEditor(issue.number));

      const toggleBtn = document.createElement("button");
      toggleBtn.type = "button";
      toggleBtn.className = "card-btn";
      toggleBtn.textContent = issue.state === "closed" ? "Reopen" : "Close";
      toggleBtn.addEventListener("click", () => toggleIssueState(issue.number));

      actions.appendChild(editBtn);
      actions.appendChild(toggleBtn);
      head.appendChild(title);
      head.appendChild(actions);

      const meta = document.createElement("div");
      meta.className = "meta";

      const state = document.createElement("span");
      state.className = "chip";
      state.textContent = issue.state;
      meta.appendChild(state);

      for (const label of issue.labels) {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = label.name;
        meta.appendChild(chip);
      }

      card.appendChild(head);
      card.appendChild(meta);
      return card;
    }

    async function toggleIssueState(issueNumber) {
      const issue = issueStore.get(issueNumber);
      if (!issue) {
        return;
      }

      const nextState = issue.state === "closed" ? "open" : "closed";

      try {
        if (activeContext.token) {
          const updated = await patchIssue(issueNumber, { state: nextState });
          issueStore.set(issueNumber, updated);
          statusEl.textContent = `Issue #${issueNumber} updated on GitHub.`;
        } else {
          issue.state = nextState;
          issueStore.set(issueNumber, issue);
          statusEl.textContent = `Issue #${issueNumber} updated locally only (add token to sync).`;
        }
        renderBoardFromStore();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    async function moveIssueToColumn(issueNumber, targetColumn) {
      const issue = issueStore.get(issueNumber);
      if (!issue) {
        return;
      }

      const currentColumn = getIssueColumn(issue);
      if (currentColumn === targetColumn) {
        return;
      }

      try {
        if (activeContext.token) {
          const payload = {
            labels: normalizeLabelsForColumn(issue, targetColumn),
            state: targetColumn === "done" ? "closed" : "open"
          };
          const updated = await patchIssue(issueNumber, payload);
          issueStore.set(issueNumber, updated);
          statusEl.textContent = `Moved issue #${issueNumber} and synced to GitHub.`;
        } else {
          issue._columnOverride = targetColumn;
          issue.state = targetColumn === "done" ? "closed" : "open";
          issueStore.set(issueNumber, issue);
          statusEl.textContent = `Moved issue #${issueNumber} locally only (add token to sync).`;
        }
        renderBoardFromStore();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    function openEditor(issueNumber) {
      const issue = issueStore.get(issueNumber);
      const card = document.querySelector(`[data-issue-number='${issueNumber}']`);
      if (!issue || !card || card.querySelector(".editor")) {
        return;
      }

      const editor = document.createElement("div");
      editor.className = "editor";

      const titleInput = document.createElement("input");
      titleInput.value = issue.title;

      const bodyInput = document.createElement("textarea");
      bodyInput.value = issue.body || "";

      const row = document.createElement("div");
      row.className = "editor-row";

      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "card-btn";
      saveBtn.textContent = "Save";

      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "card-btn";
      cancelBtn.textContent = "Cancel";

      saveBtn.addEventListener("click", async () => {
        const nextTitle = titleInput.value.trim();
        const nextBody = bodyInput.value;

        if (!nextTitle) {
          statusEl.textContent = "Title cannot be empty.";
          return;
        }

        try {
          if (activeContext.token) {
            const updated = await patchIssue(issueNumber, {
              title: nextTitle,
              body: nextBody
            });
            issueStore.set(issueNumber, updated);
            statusEl.textContent = `Saved issue #${issueNumber} to GitHub.`;
          } else {
            issue.title = nextTitle;
            issue.body = nextBody;
            issueStore.set(issueNumber, issue);
            statusEl.textContent = `Saved issue #${issueNumber} locally only (add token to sync).`;
          }
          renderBoardFromStore();
        } catch (error) {
          statusEl.textContent = error.message;
        }
      });

      cancelBtn.addEventListener("click", () => {
        editor.remove();
      });

      row.appendChild(saveBtn);
      row.appendChild(cancelBtn);
      editor.appendChild(titleInput);
      editor.appendChild(bodyInput);
      editor.appendChild(row);
      card.appendChild(editor);
    }

    async function fetchRepoSummary(owner, repo, token) {
      const headers = {
        Accept: "application/vnd.github+json"
      };
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
      if (!res.ok) {
        const body = await res.text();
        throw new Error(`GitHub API failed (${res.status}): ${body}`);
      }
      return res.json();
    }

    async function fetchAllIssues(owner, repo, token) {
      let page = 1;
      const perPage = 100;
      const allIssues = [];
      let rawItemsSeen = 0;
      let pullRequestsFiltered = 0;

      while (true) {
        const url = `https://api.github.com/repos/${owner}/${repo}/issues?state=all&per_page=${perPage}&page=${page}`;
        const headers = {
          Accept: "application/vnd.github+json"
        };

        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const res = await fetch(url, { headers });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`GitHub API failed (${res.status}): ${body}`);
        }

        const items = await res.json();
        if (!Array.isArray(items)) {
          throw new Error(`Unexpected GitHub API payload for issues list.`);
        }

        rawItemsSeen += items.length;
        if (items.length === 0) {
          break;
        }

        // Exclude pull requests because this endpoint returns both.
        const issuesOnly = items.filter((item) => !item.pull_request);
        pullRequestsFiltered += items.length - issuesOnly.length;
        allIssues.push(...issuesOnly);

        if (items.length < perPage) {
          break;
        }

        page += 1;
      }

      return {
        issues: allIssues,
        rawItemsSeen,
        pullRequestsFiltered
      };
    }

    async function fetchIssuesViaSearch(owner, repo, token) {
      let page = 1;
      const perPage = 100;
      const allIssues = [];

      while (true) {
        const url = `https://api.github.com/search/issues?q=${encodeURIComponent(`repo:${owner}/${repo} is:issue`)}&per_page=${perPage}&page=${page}`;
        const headers = {
          Accept: "application/vnd.github+json"
        };
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const res = await fetch(url, { headers });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`GitHub API failed (${res.status}): ${body}`);
        }

        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        allIssues.push(...items);

        if (items.length < perPage) {
          break;
        }
        page += 1;
      }

      return allIssues;
    }

    async function fetchReposForOwner(owner, token) {
      let page = 1;
      const perPage = 100;
      const repos = [];

      while (true) {
        const url = `https://api.github.com/users/${owner}/repos?per_page=${perPage}&page=${page}&sort=updated`;
        const headers = {
          Accept: "application/vnd.github+json"
        };
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }

        const res = await fetch(url, { headers });
        if (!res.ok) {
          const body = await res.text();
          throw new Error(`GitHub API failed (${res.status}): ${body}`);
        }

        const items = await res.json();
        repos.push(...items);

        if (items.length < perPage) {
          break;
        }
        page += 1;
      }

      return repos;
    }

    function setRepoOptions(repos, preferredName) {
      repoSelect.innerHTML = "";
      if (!repos.length) {
        const none = document.createElement("option");
        none.value = "";
        none.textContent = "No repositories found";
        repoSelect.appendChild(none);
        repoSelect.disabled = true;
        return;
      }

      repoSelect.disabled = false;
      const sorted = [...repos].sort((a, b) => a.name.localeCompare(b.name));
      for (const repo of sorted) {
        const option = document.createElement("option");
        option.value = repo.name;
        option.textContent = repo.name;
        repoSelect.appendChild(option);
      }

      const preferred = preferredName && sorted.find((r) => r.name.toLowerCase() === preferredName.toLowerCase());
      if (preferred) {
        repoSelect.value = preferred.name;
      }
    }

    async function refreshRepoDropdown(preferredName) {
      const owner = ownerInput.value.trim();
      const token = tokenInput.value.trim();

      if (!owner) {
        repoSelect.innerHTML = "";
        repoSelect.disabled = true;
        return;
      }

      repoSelect.disabled = true;
      repoSelect.innerHTML = "";
      const loading = document.createElement("option");
      loading.value = "";
      loading.textContent = "Loading repositories...";
      repoSelect.appendChild(loading);

      const repos = await fetchReposForOwner(owner, token);
      setRepoOptions(repos, preferredName || "jesus-family-tree");
    }

    function clearBoard() {
      for (const id of ["todoList", "doingList", "doneList"]) {
        document.getElementById(id).innerHTML = "";
      }
      for (const id of ["todoCount", "doingCount", "doneCount"]) {
        document.getElementById(id).textContent = "0";
      }
    }

    function renderBoard(issues) {
      clearBoard();
      const buckets = { todo: [], doing: [], done: [] };

      for (const issue of issues) {
        buckets[getIssueColumn(issue)].push(issue);
      }

      const map = {
        todo: "todoList",
        doing: "doingList",
        done: "doneList"
      };

      for (const key of Object.keys(buckets)) {
        const list = document.getElementById(map[key]);
        buckets[key]
          .sort((a, b) => b.number - a.number)
          .forEach((issue) => list.appendChild(renderIssueCard(issue)));

        document.getElementById(`${key}Count`).textContent = String(buckets[key].length);
      }
    }

    function renderBoardFromStore() {
      renderBoard([...issueStore.values()]);
    }

    function setupDropzones() {
      for (const [column, list] of Object.entries(listByColumn)) {
        list.addEventListener("dragover", (event) => {
          event.preventDefault();
          list.classList.add("drop-target");
        });

        list.addEventListener("dragleave", () => {
          list.classList.remove("drop-target");
        });

        list.addEventListener("drop", async (event) => {
          event.preventDefault();
          list.classList.remove("drop-target");
          const issueNumber = Number(event.dataTransfer.getData("text/plain"));
          if (!Number.isFinite(issueNumber)) {
            return;
          }
          await moveIssueToColumn(issueNumber, column);
        });
      }
    }

    setupDropzones();

    ownerInput.addEventListener("change", async () => {
      try {
        await refreshRepoDropdown();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    tokenInput.addEventListener("change", async () => {
      try {
        await refreshRepoDropdown(repoSelect.value);
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    loadBtn.addEventListener("click", async () => {
      const owner = ownerInput.value.trim();
      const repo = repoSelect.value.trim();
      const token = tokenInput.value.trim();

      if (!owner || !repo) {
        statusEl.textContent = "Owner and repository are required.";
        return;
      }

      loadBtn.disabled = true;
      statusEl.textContent = `Loading issues for ${owner}/${repo}...`;
      activeContext = { owner, repo, token };

      try {
        const result = await fetchAllIssues(owner, repo, token);
        let issues = result.issues;

        // Fallback: if the issues endpoint returns empty unexpectedly, retry via search API.
        if (issues.length === 0) {
          const searchIssues = await fetchIssuesViaSearch(owner, repo, token);
          if (searchIssues.length > 0) {
            issues = searchIssues;
          }
        }

        issueStore.clear();
        for (const issue of issues) {
          issueStore.set(issue.number, issue);
        }
        renderBoardFromStore();

        const summary = await fetchRepoSummary(owner, repo, token);
        statusEl.textContent = `Loaded ${issues.length} issues from ${owner}/${repo}. API rows seen: ${result.rawItemsSeen}, PR rows filtered: ${result.pullRequestsFiltered}, repo open_issues_count: ${summary.open_issues_count}.`;
      } catch (error) {
        statusEl.textContent = error.message;
      } finally {
        loadBtn.disabled = false;
      }
    });

    (async () => {
      try {
        await refreshRepoDropdown("jesus-family-tree");
        loadBtn.click();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
